[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # pdfkit lädt zur Laufzeit eigene Schriftart-Metrikdateien (.afm) aus seinem
  # node_modules-Ordner. esbuild bündelt zwar den JS-Code, kopiert solche über
  # fs.readFileSync geladenen Nicht-JS-Dateien aber NICHT automatisch mit — ohne
  # diese Zeile schlägt jede PDF-Erstellung (Zertifikate) zur Laufzeit fehl.
  included_files = ["node_modules/pdfkit/js/data/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
