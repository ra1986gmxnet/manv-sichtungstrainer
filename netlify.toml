[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # pdfkit lädt zur Laufzeit eigene Schriftart-Metrikdateien (.afm) relativ zu seinem
  # EIGENEN Ordner (node_modules/pdfkit/js/data/...). esbuild "bündelt" den Code aber
  # in eine einzige Datei und verschiebt dabei den internen Pfad, wodurch pdfkit die
  # Dateien an der falschen Stelle sucht und abstürzt. Die offizielle Lösung: pdfkit
  # vom Bündeln ausnehmen, damit es unverändert (mit seiner Original-Ordnerstruktur
  # samt Schriftdaten) mitgeliefert wird.
  external_node_modules = ["pdfkit"]
  included_files = ["node_modules/pdfkit/js/data/**", "netlify/functions/fonts/**", "netlify/functions/images/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
